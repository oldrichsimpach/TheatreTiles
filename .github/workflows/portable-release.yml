name: Publish portable TheatreTiles

on:
  push:
    branches: [main]
    paths:
      - 'DivadelniZvuky/DivadelniZvuky.csproj'
      - 'DivadelniZvuky/Publish-Portable.ps1'
      - 'DivadelniZvuky/Properties/PublishProfiles/Portable.pubxml'
      - '.github/workflows/portable-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portable-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build portable ZIP with bundled .NET
        shell: pwsh
        run: ./DivadelniZvuky/Publish-Portable.ps1
      - name: Publish release and checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$project = Get-Content DivadelniZvuky/DivadelniZvuky.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          $archive = "dist/TheatreTiles-$version-win-x64.zip"
          $checksum = "$archive.sha256"
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $archive -Leaf)" | Set-Content -LiteralPath $checksum -Encoding utf8NoBOM
          $changelog = Get-Content CHANGELOG.md -Raw
          $heading = [regex]::Escape($version)
          $entry = [regex]::Match($changelog, "(?ms)^## $heading\r?\n(?<changes>.*?)(?=^## |\z)")
          if (!$entry.Success) { throw "Chybí záznam v CHANGELOG.md pro verzi $version." }
          $notes = @'
          ## Stažení a spuštění
          Stáhněte **TheatreTiles-VERSION-win-x64.zip** v Assets. ZIP rozbalte přes **Extrahovat vše** a spusťte **TheatreTiles.exe** se zelenou ikonou T.

          Balíček je pro **64bitové Windows x64** a obsahuje vlastní .NET. SDK ani .NET Desktop Runtime nemusíte instalovat. Soubory **Source code** jsou pouze zdrojové kódy pro vývojáře.

          Přiložený soubor `.sha256` obsahuje kontrolní součet ZIPu.
          '@.Replace('VERSION', $version)
          "$notes`n`n## Změny ve verzi $version`n`n$($entry.Groups['changes'].Value.Trim())" | Set-Content release-notes.md -Encoding utf8
          gh release create "v$version" $archive $checksum --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "TheatreTiles $version — přenosná verze pro Windows" --notes-file release-notes.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publikování GitHub Release selhalo.' }
